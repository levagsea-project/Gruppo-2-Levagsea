spring:
  application:
    name: quorma-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quorma}
    username: ${SPRING_DATASOURCE_USERNAME:quorma}
    password: ${SPRING_DATASOURCE_PASSWORD:quorma}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false

server:
  port: ${SERVER_PORT:8080}

engine:
  service:
    url: ${ENGINE_SERVICE_URL:http://localhost:8081}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

jwt:
  secret: ${JWT_SECRET:quorma-dev-secret-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    
auth:
  # Registration bonus for new users
  registration-bonus: ${AUTH_REGISTRATION_BONUS:0}
