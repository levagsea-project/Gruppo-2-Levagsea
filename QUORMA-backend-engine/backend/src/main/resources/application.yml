spring:
  application:
    name: quorma-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quorma}
    username: ${SPRING_DATASOURCE_USERNAME:quorma}
    password: ${SPRING_DATASOURCE_PASSWORD:quorma}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false

server:
  port: ${SERVER_PORT:8080}

engine:
  service:
    url: ${ENGINE_SERVICE_URL:http://localhost:8081}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

jwt:
  secret: ${JWT_SECRET:quorma-dev-secret-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    
packs:
  # Placeholders until balanced. slots = exact number of creatures per Tier; support-slots = extra cards that are a
  # spell or an equipment (no Tier). The size of a pack is the sum. featured = the one the shop highlights.
  # TIER_1 comune (ranks 2-6), TIER_2 non comune (7-10), TIER_3 rara (J/Q/K), TIER_4 epica (Ace).
  types:
    standard:
      price: 200
      slots: {TIER_1: 2, TIER_2: 2}
      support-slots: 2
    advanced:
      price: 450
      slots: {TIER_1: 2, TIER_2: 2, TIER_3: 1}
      support-slots: 2
      featured: true
    elite:
      price: 1000
      slots: {TIER_2: 2, TIER_3: 2, TIER_4: 1}
      support-slots: 3

auth:
  # Registration bonus for new users
  registration-bonus: ${AUTH_REGISTRATION_BONUS:0}
