spring:
  application:
    name: quorma-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quorma}
    username: ${SPRING_DATASOURCE_USERNAME:quorma}
    password: ${SPRING_DATASOURCE_PASSWORD:quorma}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false

server:
  port: ${SERVER_PORT:8080}

engine:
  service:
    url: ${ENGINE_SERVICE_URL:http://localhost:8081}
    timeout: ${ENGINE_SERVICE_TIMEOUT:30s}
    connect-timeout: ${ENGINE_SERVICE_CONNECT_TIMEOUT:2s}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

jwt:
  secret: ${JWT_SECRET:quorma-dev-secret-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    
catalogue:
  bootstrap:
    # Off unless a folder is given. For an initial deployment, or to rebuild the database from zero: at startup, add what
    # the set files in this folder (data/sets/*.json) have and the database lacks, add-only (a card that exists is never
    # touched). Nothing is bundled into the jar, and once loaded the database is the only truth: later sets are added by
    # an admin (API) or by importing a file. The engine service may still be starting: retry a few times.
    path: ${CATALOGUE_BOOTSTRAP_PATH:}
    retries: 10
    retry-delay: 3s
  starter:
    # The set the starter decks of a new player are drawn from (one deck per faction, set as the defense deck).
    set: BASE
  # The most a batch import body may weigh (the base set is about 350 KB).
  max-import-bytes: 5MB

auth:
  # Registration bonus for new users
  registration-bonus: ${AUTH_REGISTRATION_BONUS:0}
