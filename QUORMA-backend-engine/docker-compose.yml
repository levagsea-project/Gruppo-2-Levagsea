services:
  postgres:
    image: postgres:16
    container_name: quorma-postgres
    environment:
      POSTGRES_DB: quorma
      POSTGRES_USER: quorma
      POSTGRES_PASSWORD: quorma
    ports:
      - "5432:5432"
    volumes:
      - quorma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quorma -d quorma"]
      interval: 5s
      timeout: 5s
      retries: 30

  engine:
    build:
      context: .
      dockerfile: engine-service/Dockerfile
    container_name: quorma-engine
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      JAVA_OPTS: "-Dfile.encoding=UTF-8"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: quorma-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quorma
      SPRING_DATASOURCE_USERNAME: quorma
      SPRING_DATASOURCE_PASSWORD: quorma
      ENGINE_SERVICE_URL: http://engine:8081
      JWT_SECRET: ${JWT_SECRET:-quorma-dev-secret-change-in-production}
      JWT_EXPIRATION: 86400000
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_started

volumes:
  quorma_postgres_data: